name: solpem_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  intl: ^0.20.2
  mime: ^2.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  syncfusion_flutter_datepicker: ^29.1.33

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf

